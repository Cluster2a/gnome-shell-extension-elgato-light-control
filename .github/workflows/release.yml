name: Release

# Build the extension and publish a GitHub Release whenever a version tag is
# pushed (e.g. `git tag v2.0.1 && git push origin v2.0.1`).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  UUID: elgato-light-control@cluster2a.github.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Need the full annotated tag object so its message can be used as
          # the release notes body below.
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Pack the extension
        run: |
          # Ship only the schema source — extensions.gnome.org compiles
          # schemas itself for GNOME 45+, and bundling gschemas.compiled
          # trips the EGO-P-006 review check.
          (cd "$UUID" && zip -r "../$UUID.shell-extension.zip" . \
            -x 'schemas/gschemas.compiled')

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The annotated tag message is the human-written changelog; GitHub
          # appends its own "What's Changed" / Full Changelog list underneath.
          gh release create "$GITHUB_REF_NAME" \
            "$UUID.shell-extension.zip" \
            --title "Elgato Light Control ${GITHUB_REF_NAME#v}" \
            --notes "$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:body)')" \
            --generate-notes
